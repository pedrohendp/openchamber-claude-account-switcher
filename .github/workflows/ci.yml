name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun test

      - name: Validate the extension manifest
        run: |
          bun -e "
            import { readFileSync } from 'node:fs';
            import { parseManifestJson } from '@openchamber/sdk/schemas';
            const result = parseManifestJson(readFileSync('package.json', 'utf8'));
            if (!result.ok) { console.error(result); process.exit(1); }
            console.log('Manifest OK');
          "

      # OpenChamber runs the committed bundles and never builds them, so they
      # must match the source.
      - name: Check that the bundles are up to date
        run: |
          bun run build
          git diff --exit-code -- panel/main.js status/main.js service/main.js || {
            echo "::error::A bundle is stale. Run 'bun run build' and commit panel/main.js, status/main.js and service/main.js."
            exit 1
          }
